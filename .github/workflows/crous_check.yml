name: Bot CROUS - Vérification logements

on:
  schedule:
    # Relance le bot toutes les 5 minutes (minimum autorisé par GitHub).
    # Chaque lancement vérifie ensuite toutes les 30 secondes pendant ~4 min 30.
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Permet aussi de lancer manuellement

# Évite que deux lancements tournent en même temps et écrasent la mémoire
concurrency:
  group: crous-bot
  cancel-in-progress: false

jobs:
  check-crous:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer la mémoire (annonces visibles au dernier passage)
        uses: actions/cache/restore@v4
        with:
          path: annonces_vues.json
          key: annonces-cache-${{ github.run_id }}
          restore-keys: |
            annonces-cache-

      - name: Lancer le bot CROUS
        env:
          EMAIL_EXPEDITEUR: ${{ secrets.EMAIL_EXPEDITEUR }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINATAIRE: ${{ secrets.EMAIL_DESTINATAIRE }}
          # Optionnel : crée un Secret URL_CARTE_CROUS pour ne pas afficher ta zone dans le code
          URL_CARTE_CROUS: ${{ secrets.URL_CARTE_CROUS }}
        run: python crous_bot.py

      # always() : sauvegarde même si le bot a échoué (ex : mail raté)
      - name: Sauvegarder la mémoire mise à jour
        uses: actions/cache/save@v4
        if: always() && hashFiles('annonces_vues.json') != ''
        with:
          path: annonces_vues.json
          key: annonces-cache-${{ github.run_id }}
