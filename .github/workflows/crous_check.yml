name: Bot CROUS - Vérification logements

on:
  schedule:
    # Lance le script toutes les 5 minutes (GitHub peut retarder l'exécution)
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Permet aussi de lancer manuellement

# Évite que deux vérifications tournent en même temps et écrasent la mémoire
concurrency:
  group: crous-bot
  cancel-in-progress: false

jobs:
  check-crous:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Restaure la dernière mémoire sauvegardée (sans sauvegarde automatique à la fin)
      - name: Récupérer la mémoire (annonces visibles au dernier passage)
        uses: actions/cache/restore@v4
        with:
          path: annonces_vues.json
          key: annonces-cache-${{ github.run_id }}
          restore-keys: |
            annonces-cache-

      - name: Lancer le bot CROUS
        env:
          EMAIL_EXPEDITEUR: ${{ secrets.EMAIL_EXPEDITEUR }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINATAIRE: ${{ secrets.EMAIL_DESTINATAIRE }}
        run: python crous_bot.py

      # always() : sauvegarde même si le bot a échoué (ex : mail raté)
      - name: Sauvegarder la mémoire mise à jour
        uses: actions/cache/save@v4
        if: always() && hashFiles('annonces_vues.json') != ''
        with:
          path: annonces_vues.json
          key: annonces-cache-${{ github.run_id }}
